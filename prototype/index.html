<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>One Bad Visit: the Reputation Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: story panel (left) + product screen (right); a bet-labelled progress rail on top. Light, single look matching the doc. */
:root{
  --ink:#10286e; --ink2:#2a3f80; --mut:#5b6b93; --or:#d9822b; --orS:#fdf0e3; --fill:#e8eef9; --line:#c9d4ea; --bg:#f6f8fc; --card:#fff;
  --red:#b4442e; --redS:#fbe9e5; --amb:#a15c07; --ambS:#fdf3e2; --grn:#2f7d4f; --grnS:#e6f3ea; --blu:#1d5fa8; --bluS:#e6eff9;
  --f:"Public Sans",Arial,sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
.sub a{color:var(--or)}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail button{all:unset;cursor:pointer;display:grid;gap:4px;font-size:11.5px;color:var(--mut);text-align:left}
.rail button i{display:block;height:5px;border-radius:3px;background:var(--line)}
.rail button.done i{background:var(--ink)} .rail button.cur i{background:var(--or)} .rail button.cur{color:var(--ink);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:4px}
@media (max-width:760px){.rail span{display:none}}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.story{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
.step{font-family:var(--m);font-size:12px;color:var(--mut)}
.story h2{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.bet{justify-self:start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--orS);color:var(--or);letter-spacing:.02em}
.story p{margin:0;color:var(--ink2)}
.knows{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px}
.knows b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.knows ul{margin:0;padding-left:18px}
.metric{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.metric .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.metric .v{font-weight:700}
.nav{display:flex;gap:8px;justify-content:space-between}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.screen{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:460px;display:grid;gap:12px;align-content:start}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.hi{background:var(--redS);color:var(--red)}.md{background:var(--ambS);color:var(--amb)}.lo{background:var(--grnS);color:var(--grn)}.ps{background:var(--bluS);color:var(--blu)}.nt{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.phone{width:290px;max-width:100%;border:10px solid #1f2b4d;border-radius:30px;background:#f2f4f8;padding:14px 10px;display:grid;gap:8px;min-height:420px;align-content:start}
.phone .top{font-size:11px;color:var(--mut);text-align:center}
.sms{background:#fff;border-radius:14px;padding:9px 11px;font-size:13px;max-width:92%;box-shadow:0 1px 0 rgba(16,40,110,.08)}
.sms.me{justify-self:end;background:var(--ink);color:#fff}
.notif{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;display:grid;gap:4px;box-shadow:0 1px 0 rgba(16,40,110,.08)}
.notif .t{font-weight:700}
.panel{flex:1;min-width:240px;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;font-size:13px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.ev .d{width:10px;height:10px;border-radius:50%;background:var(--ink);margin-top:5px}
.ev .d.o{background:var(--or)} .ev .d.g{background:var(--grn)} .ev .d.x{background:var(--line)}
.mono{font-family:var(--m);font-size:12.5px}
.review{border-left:3px solid var(--red);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.stars{font-family:var(--m);color:var(--amb)}
.grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:12px;text-align:center;max-width:420px}
.grid div{padding:7px 4px;border-radius:6px;background:var(--bg);color:var(--mut)}
.grid .h{background:none;font-weight:700}
.grid .on{outline:2px solid var(--or);background:var(--orS);color:var(--ink);font-weight:700}
.lad{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lad li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut)}
.ok .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.wait .dot{border-color:var(--or);color:var(--or)}
.bar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.kpi .n{font-family:var(--m);font-size:22px;font-weight:500}
.kpi .l{font-size:12px;color:var(--mut)}
.cmp{display:grid;grid-template-columns:70px 1fr 54px;gap:6px;align-items:center;font-size:12px}
.q{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.q div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.q div:last-child{border-bottom:0}
.note{font-size:12px;color:var(--mut)}
.policy{display:grid;gap:6px;font-size:13px}
.policy label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
@media (prefers-reduced-motion:no-preference){.screen>*{animation:in .35s ease both}.screen>*:nth-child(2){animation-delay:.08s}.screen>*:nth-child(3){animation-delay:.16s}@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>One bad visit, start to finish</h1>
      <div class="sub">How the 2027 reputation loop works, one bet at a time. Illustrative: all names and numbers are made up. <a href="../">Back to the strategy</a></div>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <div class="stage">
    <section class="story" aria-live="polite">
      <div class="step" id="stepn"></div>
      <h2 id="title"></h2>
      <span class="bet" id="bet"></span>
      <div id="story" style="display:grid;gap:10px"></div>
      <div class="knows" id="knows"></div>
      <div class="metric"><span class="k">Moves</span><span class="v" id="metric"></span></div>
      <div class="nav"><button class="btn" id="prev">← Back</button><button class="btn p" id="next">Next →</button></div>
    </section>
    <section class="screen" id="screen" aria-label="Product screen"></section>
  </div>
</div>

<script>
const S=[
{rail:"Visit ends",title:"The visit ends, and the ask goes out within hours",bet:"Table stakes · Event-triggered asks",
 story:["Today, asks go out as a monthly batch blast, so most happy patients are never asked.","In 2027 the ask fires off the event HighLevel already owns: the appointment is marked done. It goes by SMS within two hours, inside quiet hours, only with consent.","It also knows when <b>not</b> to ask. A patient with an open complaint is held back and routed to recovery first. Predicted sentiment never decides who gets asked; that would be review gating."],
 knows:["Appointment done · Dr. Mehta · cleaning","Paid $180 · no refund or dispute","SMS consent on file · not asked in 90 days","Open threads in Conversations"],
 metric:"Genuine reviews per location (holdout: event asks vs batch)",
 screen:`<div class="cap">Smile Studio Dental · Tuesday 3 Nov</div>
 <div class="row">
  <div class="phone"><div class="top">Messages · 12:47</div>
   <div class="sms">Hi Priya, thanks for coming in today. How was your visit with Dr. Mehta? A quick Google review helps other patients find us: g.page/smilestudio</div>
   <div class="note" style="text-align:center">Sent 12:47, 2h after checkout</div></div>
  <div class="panel"><div class="cap">Ask agent · today</div>
   <div class="ev"><span class="d g"></span><span><b>Priya S.</b> · ask sent by SMS<br><span class="note">Completed 10:30 · paid · consent ✓</span></span></div>
   <div class="ev"><span class="d g"></span><span><b>Arjun K.</b> · ask sent by email<br><span class="note">Replies on email, not SMS</span></span></div>
   <div class="ev"><span class="d o"></span><span><b>Maria L.</b> · <b>held back</b><br><span class="note">Open billing complaint in Conversations → recovery first</span></span></div>
   <div class="ev"><span class="d x"></span><span><b>Tom R.</b> · held back<br><span class="note">No SMS consent · email ask tomorrow 10:00</span></span></div>
  </div></div>`},
{rail:"1★ lands",title:"Priya leaves a 1-star review. Triage decides how much it matters",bet:"Recovery · Triage on two axes",
 story:["Not every review needs a person. Triage scores two separate things: sentiment, and stakes.","This one is High: it describes a health effect and names a staff member. Health, safety and legal words force High regardless of the model, because a missed High is the expensive mistake.","Low-stakes reviews get a grounded public reply and nobody's time."],
 knows:["Review text and rating","Business vertical: healthcare (patient-data mode on)","Rubric: health, safety, legal, staff named, reach, customer value"],
 metric:"Recall on High-stakes reviews (labelled eval set)",
 screen:`<div class="cap">Reviews · new · Google</div>
 <div class="review"><div><span class="stars">★☆☆☆☆</span> <span class="note">· "Priya S." · 2 hours ago</span></div>
 <p style="margin:6px 0 0">Waited 50 minutes, then the hygienist was rough and dismissive. My gums bled for two days. Won't be back.</p></div>
 <div class="cap" style="margin-top:6px">Triage: sentiment × stakes</div>
 <div class="grid"><div class="h"></div><div class="h">Low</div><div class="h">Medium</div><div class="h">High</div>
  <div class="h">Negative</div><div></div><div></div><div class="on">this review</div>
  <div class="h">Positive</div><div></div><div></div><div></div></div>
 <div class="row"><span class="chip hi">Health content</span><span class="chip hi">Staff described</span><span class="chip nt">Healthcare: no patient details in public</span></div>`},
{rail:"Who wrote it?",title:"Who wrote it? The review is matched to a real visit",bet:"Bet 1 · Know the reviewer",
 story:["Google display names are often nicknames, so name matching alone is weak. The match runs as a ladder.","<b>1. CRM match:</b> name, review time against visit windows, the staff or service mentioned. Here: 91% Priya S., Tuesday's cleaning.","<b>2. No match?</b> The public reply carries a way in: <i>\"Text CARE to the number on this profile\"</i>. No links, the listing's own number. Texting in captures the contact and call consent.","<b>3. Still silent after 14 days,</b> with no visit or payment on record: a fake-review evidence pack for the platform. A signal, never proof."],
 knows:["Calendar: visits in the last 7 days","Payments and staff on each visit","Reviewer display name and posting time"],
 metric:"Match rate on negative reviews (day-90 kill line: 40%)",
 screen:`<div class="row">
 <div class="panel"><div class="cap">Matched review</div>
  <ul class="lad"><li class="ok"><span class="dot">✓</span><span><b>CRM match · 91%</b><br>Priya S. · cleaning · Dr. Mehta · Tue 3 Nov 10:30<br><span class="note">Waited 50 min (rota had one hygienist out)</span></span></li>
  <li><span class="dot">2</span><span class="note">Text-in line not needed</span></li>
  <li><span class="dot">3</span><span class="note">Platform DM not needed</span></li></ul></div>
 <div class="panel"><div class="cap">Unmatched review, same day</div>
  <div class="mono">"J" · ★☆☆☆☆ · "Worst service ever."</div>
  <ul class="lad"><li><span class="dot">1</span><span>No CRM match</span></li>
  <li class="wait"><span class="dot">2</span><span><b>Reply posted with the way in</b><br><span class="mono">"We'd like to make this right. Text CARE to the number on this profile and we'll call you."</span></span></li>
  <li><span class="dot">3</span><span class="note">Day 0 of 14 · then evidence pack if no visit or payment</span></li></ul></div></div>`},
{rail:"Recover",title:"The dentist gets a brief on his phone and calls Priya back",bet:"Bet 2 · Private recovery",
 story:["The real conversation moves off the public page. For High stakes a <b>person</b> calls; the AI prepares the brief and books the slot.","For Medium stakes, an <b>AI voice call or SMS</b> goes out, only with prior consent (the FCC treats AI voices as \"artificial\" under the TCPA). It hands over to a person on anger or request.","A make-good is offered privately on a verified visit, capped and never tied to editing the review."],
 knows:["The matched visit, spend and history","What went wrong that day (rota)","The business's reply policy and banned phrases","Consent per channel"],
 metric:"Time to first contact on 1–3★ (target under 4h)",
 screen:`<div class="row">
 <div class="phone"><div class="top">Dr. Mehta's phone · 14:52</div>
  <div class="notif"><span class="t">⚠ High-stakes review · Priya S.</span><span>Cleaning Tue 10:30 · patient since 2021 · 7 visits</span></div>
  <div class="notif"><span class="t">Brief</span><span>• Apologise for the 50-min wait; one hygienist was out<br>• Offer a free follow-up with a different hygienist<br>• Don't discuss treatment in any public reply</span></div>
  <div class="sms me" style="text-align:center">Call Priya now</div>
  <div class="sms" style="text-align:center">Book for 17:30</div></div>
 <div class="panel"><div class="cap">Medium case · AI voice, with consent</div>
  <div class="mono" style="display:grid;gap:6px">
   <span><b>AI:</b> Hi Dana, this is Glow Med Spa's assistant. I saw your note about Saturday's facial. Is now OK to talk?</span>
   <span><b>Dana:</b> Yes. I was charged for a peel I didn't ask for.</span>
   <span><b>AI:</b> I can see that on your invoice. I've refunded the $60 difference. Would you like a call from the manager too?</span>
   <span><b>Dana:</b> No, that's fine. Thanks.</span></div>
  <span class="note">Hands to a person on anger or request · refund within the make-good cap</span></div></div>`},
{rail:"Loop closes",title:"The loop closes: a short public line, and Priya books again",bet:"Recovery → retention",
 story:["After the call, the public reply is one line: no recap, no rebuttal, and in healthcare nothing that confirms she's a patient (HHS has fined practices for exactly that).","It's posted only if Priya agrees on the call. She may be invited to update her review, but never as a condition of the fix.","The outcome we count is not a changed star. It's that Priya books again."],
 knows:["Call outcome: resolved, OK to note publicly","Next appointment booked"],
 metric:"Recovered customers who rebook (vs a holdout not contacted)",
 screen:`<div class="panel"><div class="cap">Public reply · posted 18:05</div>
  <div class="mono">Thanks for talking with us, Priya. Glad we could sort this out.</div>
  <span class="note">Human approved (High) · no details · patient-data filter passed</span></div>
 <div class="panel"><div class="cap">Priya S. · CRM timeline</div>
  <div class="ev"><span class="d"></span><span>Tue 10:30 · cleaning · Dr. Mehta</span></div>
  <div class="ev"><span class="d"></span><span>Tue 12:47 · review ask sent (SMS)</span></div>
  <div class="ev"><span class="d o"></span><span>Tue 14:40 · 1★ review · matched 91%</span></div>
  <div class="ev"><span class="d o"></span><span>Tue 17:30 · call with Dr. Mehta · resolved</span></div>
  <div class="ev"><span class="d g"></span><span><b>Wed 09:12 · booked follow-up · Thu 12 Nov</b></span></div></div>`},
{rail:"Agency scale",title:"Now do that for 80 clients with one account manager",bet:"Bet 3 · Agency autopilot",
 story:["Today every reply waits on client approval, one at a time. That's the agency headcount wall.","In 2027 each client approves a <b>policy once</b>: what AI may post, what needs them. Everything inside the policy runs on its own.","The account manager works <b>one queue</b> across all clients, holding only the exceptions. AI earns autonomy per category as approval rates hold, and loses it if edits rise."],
 knows:["Each client's approved policy","Approval and edit rates per category","Triage tier and match for every review"],
 metric:"Locations per account manager",
 screen:`<div class="row">
 <div class="panel" style="max-width:300px"><div class="cap">Smile Studio Dental · policy (approved once)</div>
  <div class="policy">
   <label>4–5★ replies post on their own <span class="chip lo">AI</span></label>
   <label>3★ replies <span class="chip md">Draft → me</span></label>
   <label>1–2★ replies <span class="chip md">Draft → me</span></label>
   <label>Health, legal, staff named <span class="chip hi">Always a person</span></label>
   <label>Asks after every completed visit <span class="chip lo">AI</span></label></div></div>
 <div class="panel"><div class="cap">Brightline Agency · this week</div>
  <div class="row" style="gap:18px"><div><div class="mono" style="font-size:20px">612</div><span class="note">reviews</span></div><div><div class="mono" style="font-size:20px">606</div><span class="note">handled under policy</span></div><div><div class="mono" style="font-size:20px;color:var(--or)">6</div><span class="note">need a person</span></div></div>
  <div class="q">
   <div><span class="chip hi">High</span><span>Smile Studio · Austin · 1★ health</span><span class="note">brief ready</span></div>
   <div><span class="chip hi">High</span><span>Prime Roofing · 1★ safety</span><span class="note">owner to call</span></div>
   <div><span class="chip md">Med</span><span>Glow Med Spa · confirm match</span><span class="note">2 Danas</span></div>
   <div><span class="chip md">Med</span><span>Bella Cucina · unmatched</span><span class="note">day 0/14</span></div>
   <div><span class="chip ps">High · 5★</span><span>Smile Studio · detailed 5★</span><span class="note">referral invite</span></div>
   <div><span class="chip lo">Low</span><span>QuickFix · 3★ (client asked to see)</span><span class="note">draft ready</span></div>
  </div></div></div>`},
{rail:"Outcome",title:"What it adds up to: locations that stay",bet:"The goal",
 story:["Each bet moves one driver: more genuine reviews, bad visits recovered, more locations per account manager.","Together they move the outcome the charter is measured on: <b>location churn 20% lower than a matched cohort by April 2028</b>.","The proof comes early. At day 90 the holdout must show reviews 25% above batch asks, and matching must reach 40% of negative reviews, or the plan narrows."],
 knows:["Holdouts on asks and on recovery","Billing data for churn, cohorted by vertical, size and tenure"],
 metric:"Location churn vs matched cohort (the goal)",
 screen:`<div class="cap">Brightline Agency · quarter view (illustrative)</div>
 <div class="kpis">
  <div class="kpi"><span class="l">Genuine reviews / location / month</span><div class="cmp"><span>Holdout</span><div class="bar"><i style="width:56%;background:var(--line)"></i></div><span class="mono">7.9</span></div><div class="cmp"><span>Event asks</span><div class="bar"><i style="width:72%"></i></div><span class="mono">10.1</span></div></div>
  <div class="kpi"><span class="l">Median time to first contact, 1–3★</span><div class="cmp"><span>Before</span><div class="bar"><i style="width:100%;background:var(--line)"></i></div><span class="mono">3.2d</span></div><div class="cmp"><span>Now</span><div class="bar"><i style="width:5%"></i></div><span class="mono">3.5h</span></div></div>
  <div class="kpi"><span class="l">Locations per account manager</span><div class="cmp"><span>Before</span><div class="bar"><i style="width:50%;background:var(--line)"></i></div><span class="mono">20</span></div><div class="cmp"><span>Now</span><div class="bar"><i style="width:80%"></i></div><span class="mono">32</span></div></div>
  <div class="kpi"><span class="l">Monthly location churn</span><div class="cmp"><span>Cohort</span><div class="bar"><i style="width:75%;background:var(--line)"></i></div><span class="mono">3.0%</span></div><div class="cmp"><span>Using it</span><div class="bar"><i style="width:60%;background:var(--or)"></i></div><span class="mono">2.4%</span></div></div>
 </div>
 <div class="panel"><div class="cap">Guardrails (all within limits)</div>
  <div class="row"><span class="chip lo">Platform removals ✓</span><span class="chip lo">SMS opt-outs 0.4% ✓</span><span class="chip lo">Asked vs organic star mix ✓</span><span class="chip lo">Patient-data incidents 0 ✓</span><span class="chip lo">Make-good abuse ✓</span></div></div>
 <span class="note">Numbers are illustrative targets, not HighLevel data.</span>`}
];
const rail=document.getElementById('rail'),$=id=>document.getElementById(id);
let cur=0;
function render(){
  const s=S[cur];
  rail.innerHTML=S.map((x,i)=>`<button class="${i<cur?'done':i===cur?'cur':''}" data-i="${i}" aria-current="${i===cur?'step':'false'}"><i></i><span>${i+1}. ${x.rail}</span></button>`).join('');
  $('stepn').textContent=`Step ${cur+1} of ${S.length}`;
  $('title').textContent=s.title; $('bet').textContent=s.bet;
  $('story').innerHTML=s.story.map(p=>`<p>${p}</p>`).join('');
  $('knows').innerHTML=`<b>What the system knows going in</b><ul>${s.knows.map(k=>`<li>${k}</li>`).join('')}</ul>`;
  $('metric').textContent=s.metric;
  $('screen').innerHTML=s.screen;
  $('prev').disabled=cur===0; $('next').textContent=cur===S.length-1?'Start again ↺':'Next →';
  try{history.replaceState(null,'','#step-'+(cur+1))}catch(e){}
}
function go(i){cur=(i+S.length)%S.length;render();}
rail.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)});
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur===S.length-1?0:cur+1);
